<body>
 <script>
let month = Math.floor(Math.random() * 12) + 1;
switch (month) {
    case 1: alert("Styczeń"); break;
    case 2: alert("Luty"); break;
    case 3: alert("Marzec"); break;
    case 4: alert("Kwiecień"); break;
    case 5: alert("Maj"); break;
    case 6: alert("Czerwiec"); break;
    case 7: alert("Lipiec"); break;
    case 8: alert("Sierpień"); break;
    case 9: alert("Wrzesień"); break;
    case 10: alert("Październik"); break;
    case 11: alert("Listopad"); break;
    case 12: alert("Grudzień"); break;
    default: alert("Błąd losowania");
}
    </script>
</body>
</html>
